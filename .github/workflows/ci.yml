name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # No aligners on PATH here, so the end-to-end tests skip themselves and
      # the remaining unit tests run. The integration job below covers the rest.
      - name: Run unit tests
        run: pytest tests/ -v

      - name: Check benchmark scripts are syntactically valid
        run: |
          python -m py_compile benchmark/scripts/mix_spikein.py
          python -m py_compile benchmark/scripts/compute_metrics.py

      - name: Assert no user-facing GDPR terminology
        run: python .github/scripts/check_no_gdpr.py

  shellcheck:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every benchmark script
        run: |
          for f in benchmark/scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  integration:
    name: End-to-end (conda)
    runs-on: ubuntu-latest
    # Slower than the unit job (conda solve + bowtie2-build), but it is the only
    # place the aligners actually execute, so it runs on every push and PR.
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: hostsweep
          auto-activate-base: false
          miniforge-version: latest

      - name: Install package
        shell: bash -el {0}
        run: |
          pip install -e .
          pip install pytest

      - name: Confirm the toolchain is present
        shell: bash -el {0}
        run: |
          for t in fastp minimap2 bowtie2 bowtie2-build samtools bbduk.sh; do
            command -v "$t" || { echo "missing $t"; exit 1; }
          done

      - name: Run full suite including end-to-end
        shell: bash -el {0}
        env:
          HOSTSWEEP_BBDUK_MEM: 2g
        run: pytest tests/ -v

      - name: Fail if the end-to-end tests silently skipped
        shell: bash -el {0}
        run: |
          pytest tests/test_e2e_pipeline.py -v -rs 2>&1 | tee out.txt
          if grep -q "SKIPPED" out.txt; then
            echo "End-to-end tests skipped in the integration job; toolchain is incomplete."
            exit 1
          fi
