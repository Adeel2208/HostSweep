# HostSweep runtime environment.
#
# Versions are PINNED to the exact builds the benchmark was run with, so a
# reader reproduces the reported numbers rather than whatever the solver
# happens to pick today. Previously these were `>=` floors, which meant two
# people running the same command could get different aligner versions and
# different results.
#
# For a bit-exact rebuild of the environment the benchmark actually used,
# prefer the explicit lockfile, which records every transitive dependency and
# its build string:
#
#     conda create --name hostsweep --file benchmark/run/record/conda_explicit.txt
#
# This file is the human-readable equivalent: same direct dependencies, same
# versions, resolved fresh.
#
# `defaults` is deliberately absent. It is Anaconda's licensed channel, and
# including it can stall a non-interactive solve on a terms-of-service prompt.
# conda-forge and bioconda supply everything here.

name: hostsweep

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python
  - python=3.11.16
  - pip
  - setuptools

  # Alignment and QC
  - fastp=1.3.6
  - minimap2=2.31
  - bowtie2=2.5.5
  - samtools=1.24
  - bbmap=40.02

  # Python packages
  - numpy=2.4.6
  - pandas=3.0.5
  - scipy=1.17.1
  - urllib3=2.7.0

# multiqc was removed. It is a reporting tool, is not invoked by the pipeline
# or by any benchmark script, and dominated the dependency solve. Recorded as
# deviation D12 in benchmark/run/DEVIATIONS.md.
#
# Benchmark-only tools live in separate environments so their dependencies
# cannot perturb the runtime environment. See benchmark/scripts/wsl_setup.sh
# and benchmark/scripts/install_comparators.sh:
#
#     art, seqkit            read simulation and FASTA handling
#     sra-tools, pigz        real-library download
#     hostile                comparator (2.x required; 1.x invalidates it)
#     kneaddata              comparator
#     bmtagger, srprism      comparator
#     megahit, quast         downstream assembly (python<3.12; QUAST needs distutils)
#     kraken2                downstream classification
